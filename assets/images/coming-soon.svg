<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBF8" />
      <stop offset="30%" stop-color="#F7DDE5" />
      <stop offset="70%" stop-color="#E8E0F5" />
      <stop offset="100%" stop-color="#F9E4D5" />
    </linearGradient>
    <filter id="glowCs" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="380" fill="url(#bgCs)" rx="16" />

  <!-- Elegant floating sparkles and constellation dots -->
  <g opacity="0.6">
    <circle cx="120" cy="80" r="3" fill="#C58B8A" />
    <circle cx="480" cy="90" r="4" fill="#C58B8A" />
    <circle cx="150" cy="300" r="3.5" fill="#A46968" />
    <circle cx="460" cy="290" r="3" fill="#C58B8A" />
    <path d="M 120 80 L 170 120 L 150 160" fill="none" stroke="#C58B8A" stroke-width="0.8" stroke-dasharray="3 3" />
    <path d="M 480 90 L 440 130 L 460 170" fill="none" stroke="#C58B8A" stroke-width="0.8" stroke-dasharray="3 3" />
  </g>

  <!-- Central Creative Lab Glass Container -->
  <g transform="translate(130, 60)">
    <rect width="340" height="260" rx="20" fill="#FFFFFF" opacity="0.85" stroke="#C58B8A" stroke-width="1.5" stroke-dasharray="8 6" />
    
    <!-- Central Glowing Star / Sparkle of Innovation -->
    <circle cx="170" cy="95" r="40" fill="#F7DDE5" filter="url(#glowCs)" opacity="0.6" />
    <circle cx="170" cy="95" r="28" fill="#FFFBF8" stroke="#C58B8A" stroke-width="1.5" />
    
    <!-- Four Point Sparkle Star -->
    <path d="M 170 75 Q 170 95 150 95 Q 170 95 170 115 Q 170 95 190 95 Q 170 95 170 75 Z" fill="#C58B8A" />

    <text x="170" y="160" font-family="'Playfair Display', Georgia, serif" font-size="19" font-weight="700" fill="#34313A" text-anchor="middle">Innovative Works in Progress</text>
    <text x="170" y="185" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#6C6674" text-anchor="middle">Upcoming full-stack and creative projects</text>
    
    <!-- Badges -->
    <rect x="75" y="210" width="85" height="22" rx="11" fill="#DFECF7" />
    <text x="117" y="225" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#34313A" text-anchor="middle">Exploring</text>

    <rect x="170" y="210" width="95" height="22" rx="11" fill="#F9E4D5" />
    <text x="217" y="225" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#34313A" text-anchor="middle">Continuous Learning</text>
  </g>
</svg>
