<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgEs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E4D5" />
      <stop offset="50%" stop-color="#FFFBF8" />
      <stop offset="100%" stop-color="#F7DDE5" />
    </linearGradient>
    <linearGradient id="cardGradEs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FAF6F4" />
    </linearGradient>
    <filter id="shadowEs" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#34313A" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="600" height="380" fill="url(#bgEs)" rx="16" />

  <g filter="url(#shadowEs)" transform="translate(60, 45)">
    <!-- App Window -->
    <rect width="480" height="290" rx="12" fill="url(#cardGradEs)" stroke="rgba(197, 139, 138, 0.3)" stroke-width="1.5" />
    
    <!-- Header -->
    <rect width="480" height="42" rx="12" fill="#FAF3EF" />
    <circle cx="24" cy="21" r="5" fill="#F7DDE5" stroke="#C58B8A" stroke-width="0.8" />
    <circle cx="40" cy="21" r="5" fill="#F9E4D5" stroke="#C58B8A" stroke-width="0.8" />
    <circle cx="56" cy="21" r="5" fill="#DFECF7" stroke="#C58B8A" stroke-width="0.8" />
    
    <text x="80" y="26" font-family="'Playfair Display', serif" font-weight="700" font-size="13" fill="#34313A">ExecuSync</text>
    <rect x="160" y="14" width="75" height="16" rx="8" fill="#E8E0F5" opacity="0.8" />
    <text x="175" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" fill="#34313A">Productivity</text>

    <!-- Content: Split columns for task sync and schedule -->
    <!-- Column 1: Tasks / Sync status -->
    <g transform="translate(24, 60)">
      <rect width="205" height="205" rx="10" fill="#FFFBF8" stroke="#EFE4E0" stroke-width="1" />
      <text x="16" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#34313A">Active Workflow</text>
      
      <!-- Task 1 -->
      <rect x="14" y="38" width="177" height="44" rx="6" fill="#FDF7F5" stroke="#F9E4D5" stroke-width="1" />
      <circle cx="28" cy="60" r="6" fill="#C58B8A" />
      <rect x="42" y="52" width="95" height="7" rx="3" fill="#34313A" opacity="0.8" />
      <rect x="42" y="64" width="55" height="5" rx="2" fill="#6C6674" opacity="0.6" />
      <rect x="148" y="52" width="34" height="14" rx="7" fill="#E8E0F5" />
      <text x="156" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="600" fill="#34313A">Done</text>

      <!-- Task 2 -->
      <rect x="14" y="90" width="177" height="44" rx="6" fill="#F7F9FC" stroke="#DFECF7" stroke-width="1" />
      <circle cx="28" cy="112" r="6" fill="#DFECF7" stroke="#34313A" stroke-width="1.5" />
      <rect x="42" y="104" width="85" height="7" rx="3" fill="#34313A" opacity="0.8" />
      <rect x="42" y="116" width="65" height="5" rx="2" fill="#6C6674" opacity="0.6" />
      <rect x="142" y="104" width="40" height="14" rx="7" fill="#F7DDE5" />
      <text x="149" y="114" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="600" fill="#A46968">In Sync</text>

      <!-- Task 3 -->
      <rect x="14" y="142" width="177" height="44" rx="6" fill="#FFFBF8" stroke="#EFE4E0" stroke-width="1" />
      <circle cx="28" cy="164" r="6" fill="#FAF6F4" stroke="#C58B8A" stroke-width="1" />
      <rect x="42" y="156" width="105" height="7" rx="3" fill="#34313A" opacity="0.8" />
      <rect x="42" y="168" width="45" height="5" rx="2" fill="#6C6674" opacity="0.6" />
    </g>

    <!-- Column 2: Analytics & Metrics -->
    <g transform="translate(245, 60)">
      <rect width="210" height="98" rx="10" fill="#FFFBF8" stroke="#EFE4E0" stroke-width="1" />
      <text x="16" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#34313A">Execution Metrics</text>
      
      <!-- Mini Chart -->
      <line x1="20" y1="80" x2="190" y2="80" stroke="#F0E8E4" stroke-width="1" />
      <polyline points="25,72 55,60 90,65 125,44 160,50 185,35" fill="none" stroke="#C58B8A" stroke-width="2.5" />
      <circle cx="125" cy="44" r="4" fill="#C58B8A" />
      <circle cx="185" cy="35" r="4" fill="#34313A" />

      <!-- Quick Stats Card below -->
      <rect y="110" width="210" height="95" rx="10" fill="#FAF5F8" stroke="#F7DDE5" stroke-width="1" />
      <text x="16" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#34313A">Sync Progress</text>
      
      <!-- Progress Bar 1 -->
      <rect x="16" y="146" width="178" height="8" rx="4" fill="#EAE2EB" />
      <rect x="16" y="146" width="145" height="8" rx="4" fill="#C58B8A" />

      <rect x="16" y="168" width="178" height="8" rx="4" fill="#EAE2EB" />
      <rect x="16" y="168" width="115" height="8" rx="4" fill="#A46968" opacity="0.75" />
      
      <text x="16" y="193" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#6C6674">92% operational efficiency achieved</text>
    </g>
  </g>
</svg>
